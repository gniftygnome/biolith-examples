loom {
    accessWidenerPath.set(file("src/main/resources/biolith_examples.classtweaker"))
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Use the Fabric platform release of Biolith just for the API;
    // The correct platform release must be declared as a dependency of all mod platforms
    compileOnly "com.terraformersmc:biolith-fabric:${rootProject.biolith_version}"
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.first()
    commonResources sourceSets.main.resources.sourceDirectories.files
}
